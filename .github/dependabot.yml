# 상류 패키지가 움직인 것을 **우리가 먼저** 알기 위한 것이다.
#
# 왜 필요한가 — 이 저장소의 실패 모양은 diff 가 아니라 **시간**을 탄다.
# 상류가 새 버전을 내도 우리 저장소는 한 글자도 안 바뀌므로 어떤 게이트도
# 걸리지 않는다. 그런데 **생성되는 프로젝트는 `pubspec.lock` 을 물려받지 않아**
# caret 범위 안에서 새로 해석하므로, 우리는 옛 버전으로 초록이고 사용자는 새
# 버전으로 빨간 상태가 조용히 성립한다.
#
# 실물: `flutter_checkbox` 0.3.2 가 시맨틱을 고쳤는데(`flutter_checkbox#7`)
# 우리 테스트가 고쳐지기 **전** 모습을 정답으로 못박고 있었다. `template` 은
# lock 이 0.3.1 을 잡아 초록, 갓 생성된 프로젝트는 0.3.2 를 받아 2개 빨강.
# 임시 폴더에 진짜 프로젝트를 한 번 만들어 보고서야 알았다. 그 릴리스가
# 우리가 상류에 올려두고 기다리던 `CheckboxStyle.shadows` 도 함께 들고 있었다 —
# 즉 **좋은 소식도 같이 놓치고 있었다.**
#
# Dependabot 이 PR 을 열면 CI 가 그 테스트들을 빨갛게 만들고, 우리는 상류가
# 움직인 주에 안다.
#
# **한계 둘.**
# - pub 은 **보안 업데이트를 지원하지 않는다.** 버전 업데이트만 온다. CVE 는
#   이 경로로 알 수 없다.
# - 이건 우리 저장소를 테스트하지 **제품(생성 결과)** 을 테스트하지 않는다.
#   상류 릴리스와 PR 머지 사이의 창은 좁아질 뿐 사라지지 않는다. 창을 없애려면
#   생성물이 새로 해석하지 않게 해야 한다 — 별도 결정이다.

version: 2

updates:
  - package-ecosystem: "pub"
    # 루트에 pubspec.yaml 이 없다. Flutter 프로젝트가 둘이고 워크스페이스로
    # 묶여 있지 않아서 각각 걸어야 한다.
    directories:
      - "/template"
      - "/builder"
    schedule:
      interval: "weekly"

    # 첫 실행에서 5개가 전부 template 것으로 차서 builder 는 처리조차 안 됐다.
    # 아래 ignore 로 소음이 빠지므로 이 숫자에 부딪힐 일은 줄지만, 한 디렉토리가
    # 다른 쪽을 굶기는 모양은 남는다.
    open-pull-requests-limit: 10

    ignore:
      # **`intl` 은 영원히 초록이 될 수 없다.** SDK 의 `flutter_localizations`
      # 가 `intl` 을 정확한 버전으로 못박는다. Dependabot 이 `^0.20.3` 을
      # 제안했을 때 CI 가 이렇게 답했다:
      #
      #   Because mobile_init_project depends on flutter_localizations from sdk
      #   which depends on intl 0.20.2, intl 0.20.2 is required.
      #   So, because mobile_init_project depends on intl ^0.20.3,
      #   version solving failed.
      #
      # 머지할 수 없는 PR 이 주마다 뜨면 사람들이 Dependabot 자체를 무시하게
      # 되고, 그러면 이걸 켠 이유가 사라진다.
      - dependency-name: "intl"

      # **메이저는 주간 알림이 아니라 의도적으로 하는 작업이다.**
      # 첫 실행에 뜬 다섯 중 넷이 메이저였다 — riverpod 2→3, fl_chart 0.70→1.x,
      # flutter_lints 5→6, build_runner. 전부 머지 버튼 하나로 끝나지 않는
      # 마이그레이션이라 PR 로 떠 있으면 그냥 쌓인다. 필요할 때
      # `dart pub outdated` 로 언제든 본다.
      #
      # **여기서 잡으려던 것은 마이너·패치다.** 우리를 문 것이
      # `flutter_checkbox` 0.3.1 → 0.3.2 였고 그건 패치다.
      #
      # **알고 있는 구멍:** 0.x 패키지는 두 번째 자리가 메이저 경계다. 즉
      # `flutter_checkbox` 가 0.4.0 을 내면 이 규칙이 가린다. 그쪽은 우리가
      # 상류 이슈를 열어둔 저장소들이라(`flutter_checkbox#8`,
      # `flutter_dropdown_button#88`) GitHub 이 직접 알려주는 것에 기댄다.
      # 그 경로가 끊기면 이 줄을 다시 본다.
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]

    # **`groups` 를 뺐다 (2026-08-21).** 넣었다가 되돌린 것이라 이유를 적어둔다.
    #
    # 원래 의도: 같은 패키지를 두 디렉토리에서 한 PR 로 올려
    # `generator_version_parity_test` 가 반쪽 PR 때문에 빨개지는 것을 막는다.
    #
    # 실제로 나온 것: `patterns: ["*"]`(전부 한 묶음)와
    # `group-by: dependency-name`(이름별로 쪼개라)를 동시에 시킨 셈이라,
    # **패키지마다 PR 을 하나씩 열되 내용은 셋 다 같은** 상태가 됐다. #64·#66·#67
    # 의 `pubspec.yaml` 이 같은 blob 이었고, 제목만 서로 다른 패키지를 말했다.
    # 같은 PR 들에 위 `ignore` 로 막았어야 할 `intl` 과 riverpod 메이저가
    # 들어 있었다 — 그룹 해석이 ignore 를 우회한 것으로 보이나 확인은 못 했다.
    #
    # **애초에 값이 검증된 적이 없다.** `flutter_tweakcn_generator` 는 지금
    # 최신이라 그 상황을 한 번도 만들지 않았고, 문제의 PR 들에 걸린 패키지는
    # 전부 template 에만 있어 짝지을 것이 없었다.
    #
    # **그리고 파리티 테스트가 이미 그 가드다.** 갈리면 시끄럽게 빨개지고 그때
    # 손으로 맞추면 된다 — 2026-08-17 의 `flutter_dropdown_button` 4.2.0 에서
    # 실제로 그렇게 잡혔다. 없어도 되는 것을 넣었다가 버그를 들인 것이다.
    #
    # 다시 넣고 싶어지면, 먼저 한 사이클을 관찰해서 반쪽 PR 이 실제로 생기는지
    # 보고 나서 넣는다.

    commit-message:
      prefix: "chore"
      include: "scope"
