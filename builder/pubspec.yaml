name: mobile_init_builder
description: "mobile_init_project 템플릿으로 새 Flutter 앱을 찍어내는 데스크톱 도구."

publish_to: "none"

version: 1.0.0+1

environment:
  # Flutter 3.35.0 (Dart 3.9.0) 에서 확인했다 — 별도로 받은 3.35.0 으로 테스트
  # 135개 전부 통과하고, 진짜 생성까지 돌려 결과물 테스트도 통과한다.
  #
  # flutter create 가 찍어둔 ^3.12.2 는 그때 개발 머신에 깔려 있던 SDK 였을
  # 뿐이고, 필요한 값보다 9개 마이너 버전 높았다. 하한은 template 을 통해
  # 들어오는 shared_preferences 2.5.5 의 flutter >=3.35.0 에서 온다.
  sdk: ^3.9.0
  flutter: ">=3.35.0"

dependencies:
  file_picker: ^11.0.2
  flutter:
    sdk: flutter

  # 미리보기 캔버스가 템플릿 예제 페이지를 그대로 띄우기 때문에, 그 페이지가
  # 쓰는 것들이 빌더에도 필요하다 — l10n delegate, ProviderScope, .w/.h/.sp.
  flutter_localizations:
    sdk: flutter
  flutter_riverpod: ^2.6.1
  flutter_screenutil: ^5.9.3

  # 붙여넣은 CSS를 런타임에 파싱하는 데 쓴다 (CssParser.parse).
  flutter_tweakcn_generator: ^0.5.0

  # 미리보기 캔버스에 쓰는 진짜 컴포넌트의 출처.
  # 사본이 아니라 template/ 의 소스를 그대로 컴파일한다.
  mobile_init_project:
    path: ../template
  path: ^1.9.1
  shared_preferences: ^2.5.5

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
