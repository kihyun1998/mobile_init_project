name: mobile_init_project
description: "A new Flutter project."

publish_to: "none"

version: 1.0.0+1

environment:
  # Flutter 3.35.0 (Dart 3.9.0) 에서 확인했다 — 템플릿 테스트와, 이 템플릿으로
  # 실제 생성한 프로젝트의 테스트가 양쪽 다 통과한다.
  #
  # 하한은 shared_preferences 2.5.5 가 flutter >=3.35.0 을 요구하는 데서 온다.
  # 직접 의존성 중 가장 높다 (다음이 flutter_screenutil 의 >=3.10.0).
  #
  # 이 값은 생성되는 모든 프로젝트로 그대로 따라가므로 거짓으로 두면 안 된다.
  # 예전의 >=3.0.0 은 의존성이 이미 반증하는 값이어서, 낮은 SDK 를 쓰는 사람의
  # pub get 은 통과시키면서 컴파일만 실패하게 만들었다.
  sdk: ^3.9.0
  flutter: ">=3.35.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.8
  # shadcn_checkbox 가 이 위에 앉는다. 색은 전부 CheckboxStyle 로 주입하므로
  # 패키지가 테마를 따로 정하지 않는다 — tweakcnColors 가 그대로 흐른다.
  flutter_checkbox: ^0.3.2
  # shadcn_select 가 이 위에 앉는다. flutter_checkbox 와 달리 이 패키지는 안 넘긴
  # 색을 ThemeData 의 레거시 필드(splash/highlight/hover/disabled/hint/iconTheme)
  # 에서 가져오는데, TweakcnTheme 는 그것들을 채우지 않는다 — 그래서 색을 하나도
  # 빠짐없이 명시적으로 넘긴다. 근거는 shadcn_select.dart 의 doc-comment.
  flutter_dropdown_button: ^4.1.0
  flutter_riverpod: ^2.6.1
  flutter_screenutil: ^5.9.0
  flutter_svg: ^2.2.0
  intl: ^0.20.2
  logger: ^2.5.0
  riverpod_annotation: ^2.6.1
  shared_preferences: ^2.5.4
  fl_chart: ^1.2.0

dev_dependencies:
  build_runner: ^2.5.4
  flutter_lints: ^5.0.0
  flutter_test:
    sdk: flutter
  flutter_tweakcn_generator: ^0.5.1
  intl_utils: ^2.8.11
  riverpod_generator: ^2.6.5
  riverpod_lint: ^2.6.5

flutter:
  uses-material-design: true

flutter_intl:
  enabled: true
  arb_dir: lib/core/localization/l10n
  output_dir: lib/core/localization/generated

flutter_tweakcn_generator:
  input: tweakcn.css
  output: lib/core/theme/tweakcn_theme.g.dart
  font_mode: local
